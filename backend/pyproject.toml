[project]
name = "mcp-using-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhuvana Venkata Chandu", email = "eluribhuvanavenkatachandu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "mcp>=1.30.0",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "redis>=8.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-using-langchain = "mcp_using_langchain:main"
mcp-server = "mcp_using_langchain.server:start"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
